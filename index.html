<style>

.testbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}.tt{display:flex;flex-direction:column}.tt b{font-family:'Baloo 2',sans-serif;font-size:20px;color:var(--r)}.tt small{color:var(--m);font-weight:700}
.timer{background:var(--r);color:#fff;padding:6px 16px;border-radius:99px;font-size:20px;box-shadow:0 4px 0 #8f0b21}.timer::before{content:'⏰ '}

.ring::before{content:'';position:absolute;inset:16px;background:#fff;border-radius:50%}.ring b,.ring small{position:relative;z-index:1}.ring b{font-family:'Baloo 2',sans-serif;font-size:56px;line-height:1;color:var(--r)}.ring small{font-weight:800;color:var(--m)}
.msg{font-size:20px;font-weight:800;color:var(--r)}

.pd.p0{border-color:var(--r);padding-top:26px;box-shadow:var(--sh);background:var(--soft)}.pd.p1{padding-top:18px}.md2{font-size:42px}.pd .sc{font-family:'Baloo 2',sans-serif;font-size:30px;color:var(--r)}

.md{background:#fff;border-radius:26px;padding:24px;width:100%;max-width:760px;position:relative;border:4px solid var(--pink)}.x{position:absolute;right:14px;top:8px;border:0;background:none;font-size:30px;cursor:pointer;color:var(--r)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:12px 22px;border-radius:99px;z-index:50;display:none;max-width:90vw;font-weight:700}#toast.e{background:var(--r)}
.opimg{max-width:100%;max-height:220px;border-radius:10px;vertical-align:middle}
.pz{border:2.5px dashed var(--r);border-radius:14px;padding:12px;text-align:center;color:var(--r);font-size:13px;font-weight:700;margin:8px 0;cursor:text}.pz:focus{background:var(--soft);outline:none}

<script>
/* >>> ISI DENGAN DATA PROYEK SUPABASE ANDA (Project Settings → API) <<< */
const SUPABASE_URL='https://hrdoboisvoqsbcctwmxc.supabase.co';
const SUPABASE_KEY='sb_publishable_M2sDsMHV16CrLMlEE2MLUg_HUWUkrmt';

const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=v=>/^https?:\/\//.test(v||'')?esc(v):'';
let sb,S={cfg:{},kec:[],stat:{},pkt:[],tok:null,me:null,peserta:null,view:'dash'},TS,TM,E,AS={soal:[],pid:0},LB={m:'',n:''};
const MAPEL=['Matematika','Bahasa Indonesia'],LET='ABCDEFGH',KAT=['Benar|Salah','Tepat|Kurang Tepat','Sesuai|Tidak Sesuai'];

async function call(a,p){const {data,error}=await sb.rpc('api',{action:a,p:Object.assign({},p||{},{token:S.tok})});if(error)throw new Error(error.message);return data}
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4000)}
async function T(f){try{return await f()}catch(e){toast(e.message||String(e),1)}}
function modal(h){$('#modal').innerHTML=`<div class="mb" onclick="if(event.target==this)closeM()"><div class="md"><button class="x" onclick="closeM()">×</button>${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function theme(){document.documentElement.style.setProperty('--r',S.cfg.warnaMerah||'#C8102E');$('#brand').innerHTML='<span class="logo">🎓</span>'+esc(S.cfg.judul||'CBT TKA SD');document.title=S.cfg.judul||'CBT TKA SD'}
function nav(){const m=[['dash','🏠 Dashboard'],['daftar','✏️ Daftar & Kerjakan Tes'],['lb','🏆 Leader Board'],['unduh','📄 Unduh Hasil'],S.tok?['admin','⚙️ Panel Admin']:['login','🔑 Login Admin']];
$('#nav').style.display=(TS&&TS.on)?'none':'';$('#nav').innerHTML=m.map(x=>`<a href="#" class="${S.view==x[0]?'on':''}" onclick="show('${x[0]}');return false">${x[1]}</a>`).join('')}
function show(v){if(TS&&TS.on)return toast('Selesaikan tes terlebih dahulu.',1);clearInterval(TM);S.view=v;nav();window.scrollTo(0,0);({dash:vDash,daftar:vDaftar,lb:vLb,unduh:vUnduh,login:vLogin,admin:vAdmin})[v]()}
(async()=>{try{
if(SUPABASE_URL.indexOf('supabase.co')<0)throw new Error('SUPABASE_URL & SUPABASE_KEY belum diisi di index.html.');
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
try{const a=JSON.parse(sessionStorage.getItem('adm'));if(a){S.tok=a.token;S.me=a}}catch(e){}
const d=await call('publik');S.cfg=d.cfg;S.kec=d.kecamatan;S.stat=d.stat;S.pkt=d.paket;theme();show('dash')}
catch(e){$('#app').innerHTML=`<div class="card"><b>Aplikasi belum siap.</b><p>${esc(e.message)}</p></div>`}})();

/* ===== Dashboard ===== */
function vDash(){const c=S.cfg;
$('#app').innerHTML=`<section class="hero"><div><span class="chip">🎉 Ayo belajar bersama!</span><h1>${esc(c.judul)}</h1><p class="sub">${esc(c.subjudul)}</p><p>${esc(c.deskripsi)}</p><button class="btn lg pulse" onclick="show('daftar')">${esc(c.teksTombol)} 🚀</button></div><div class="hr">${url(c.bannerUrl)?`<img src="${url(c.bannerUrl)}" alt="">`:`<div class="mascot big">🦉</div><br><div class="bubble">Halo, teman-teman! Siap jadi juara? 🌟</div>`}</div></section><div class="stats" id="st"></div><div class="card"><h2>📌 Petunjuk</h2><p>${esc(c.petunjuk)}</p></div>`;
T(async()=>{const d=await call('publik');S.stat=d.stat;const s=d.stat;$('#st').innerHTML=[['👧','Peserta',s.peserta],['✅','Tes selesai',s.tes],['⭐','Rata-rata nilai',s.rata],['🔓','Paket dirilis',s.dirilis+' / 20']].map(x=>`<div class="st"><span class="ic">${x[0]}</span><b>${x[2]}</b><span>${x[1]}</span></div>`).join('')})}

/* ===== Daftar & tes ===== */
function vDaftar(){const p=S.peserta;
if(!p){$('#app').innerHTML=`<div class="card form"><div class="mascot">🦉</div><h2>Ayo Daftar Dulu!</h2><p class="hint">Isi datamu dengan benar ya, teman-teman.</p>
<label class="f">🧒 Nama Lengkap</label><input id="d_n" placeholder="Tulis nama lengkapmu">
<label class="f">📍 Kecamatan (Kabupaten Wonosobo)</label><select id="d_k"><option value="">— pilih kecamatan —</option>${S.kec.map(k=>`<option>${k}</option>`).join('')}</select>
<label class="f">🏫 Nama Sekolah</label><input id="d_s" placeholder="contoh: SD Negeri 1 Wonosobo">
<label class="f">🎒 Kelas</label><input id="d_c" placeholder="contoh: 6A">
<p style="text-align:center"><button class="btn lg" onclick="daftar()">Daftar & Lanjut 🚀</button></p></div>`;return}
$('#app').innerHTML=`<div class="card row hello"><div><h2 style="margin:0">👋 Halo, ${esc(p.nama)}!</h2><span class="hint">${esc(p.sekolah)} · Kelas ${esc(p.kelas)} · Kec. ${esc(p.kecamatan)}</span></div><button class="b2 sm" onclick="S.peserta=null;vDaftar()">Ganti peserta</button></div><p class="hint" style="font-size:16px">Pilih paket soal yang sudah terbuka, lalu kerjakan dengan teliti ya! 💪</p><div id="pk">Memuat paket…</div>`;
T(async()=>{const d=await call('publik',{peserta_id:p.id});S.pkt=d.paket;
$('#pk').innerHTML=MAPEL.map((m,mi)=>`<div class="mp m${mi+1}"><div class="mh"><span class="ic">${mi?'📚':'📐'}</span><h3>${m}</h3></div><div class="pgd">${d.paket.filter(x=>x.mapel==m).map(x=>{const done=d.selesai.includes(x.id),ok=x.rilis&&x.jml>0;
return `<div class="pc ${done?'done':ok?'':'off'}"><div class="no">${ok||done?x.nomor:'🔒'}</div><b>${esc(x.judul)}</b><small>${x.jml} soal · ${x.durasi} menit</small>${done?'<em>✅ Sudah selesai</em>':ok?`<button class="btn sm" onclick="intro(${x.id})">Kerjakan 🚀</button>`:'<em>Belum dibuka</em>'}</div>`}).join('')}</div></div>`).join('')})}
function daftar(){T(async()=>{S.peserta=await call('daftar',{nama:$('#d_n').value,kecamatan:$('#d_k').value,sekolah:$('#d_s').value,kelas:$('#d_c').value});toast('Pendaftaran berhasil');vDaftar()})}
const MX=()=>{const v=parseInt(S.cfg.maxPelanggaran);return isNaN(v)?3:v};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function intro(id){const x=S.pkt.find(p=>p.id==id),mx=MX();
$('#app').innerHTML=`<div class="card intro" style="max-width:640px;margin:auto"><div class="mascot">🦉</div><h2 style="text-align:center">Siap mengerjakan?</h2><p class="sub" style="text-align:center;color:var(--r)">${esc(x.mapel)} – ${esc(x.judul)}</p>
<p style="text-align:center"><span class="pill pub">📝 ${x.jml} soal</span> <span class="pill pub">⏰ ${x.durasi} menit</span> <span class="pill pub">1️⃣ hanya satu kali</span></p><ul style="line-height:1.8">
<li>Waktu berjalan sejak tombol Mulai ditekan dan tetap berjalan walau halaman dimuat ulang.</li>

function setA(id,v){TS.A[id]=v;rT()}

catch(e){TS.sending=false;$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:auto"><h3>Gagal mengirim jawaban</h3><p>${esc(e.message)}</p><div class="row"><button class="btn" onclick="selesai(true)">Kirim ulang</button><button class="b2" onclick="TS.on=false;document.body.classList.remove('testmode');nav();vDaftar()">Keluar</button></div></div>`}})}

/* ===== Render soal & stimulus ===== */
function chart(v){const L=v.split('\n').map(s=>s.trim()).filter(Boolean),t=L.shift()||'',d=L.map(l=>{const i=l.lastIndexOf(':');return[l.slice(0,i),parseFloat(l.slice(i+1))||0]}),m=Math.max(1,...d.map(x=>x[1])),W=d.length*60+50;
return `<svg viewBox="0 0 ${W} 190" class="chart"><text x="${W/2}" y="14" text-anchor="middle" font-size="11" font-weight="700">${esc(t)}</text><line x1="30" y1="160" x2="${W-5}" y2="160" stroke="#999"/>`+d.map((x,i)=>{const h=x[1]/m*120,X=40+i*60;return `<rect x="${X}" y="${160-h}" width="40" height="${h}" fill="#C8102E"/><text x="${X+20}" y="${155-h}" text-anchor="middle" font-size="10">${x[1]}</text><text x="${X+20}" y="175" text-anchor="middle" font-size="9">${esc(x[0])}</text>`}).join('')+'</svg>'}
function emb(v){if(!url(v))return '';const m=v.match(/drive\.google\.com\/file\/d\/([^\/]+)/);if(m)return `<iframe src="https://drive.google.com/file/d/${esc(m[1])}/preview"></iframe>`;
const x=v.split('?')[0].toLowerCase();if(/\.pdf$/.test(x))return `<iframe src="${url(v)}"></iframe>`;
if(/\.(docx?|pptx?|xlsx?)$/.test(x))return `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(v)}"></iframe>`;
if(/\.(png|jpe?g|gif|webp)$/.test(x))return `<img src="${url(v)}" alt="">`;return `<a href="${url(v)}" target="_blank" rel="noopener">Buka lampiran stimulus</a>`}
function sHTML(t,v){if(!t||t=='none'||!v)return '';let b='';
if(t=='teks')b=esc(v);else if(t=='gambar')b=url(v)?`<img src="${url(v)}" alt="Stimulus gambar">`:'';else if(t=='grafik')b=chart(v);else b=emb(v);
return `<div class="stim">${b}</div>`}
function oH(o){const p=pO(o);return p.img?`<span><img class="opimg" src="${url(p.img)}" alt="">${p.cap?'<br>'+esc(p.cap):''}</span>`:`<span>${esc(p.cap)}</span>`}
function qHTML(q,n,A,mode,p){const a=A[q.id],dis=mode=='key'?'disabled':'',ky=mode=='key'?q.kunci||[]:null,nm=p+q.id,P=q.perm||q.opsi.map((_,i)=>i);let h=sHTML(q.sTipe,q.stimulus)+`<p class="qt"><span class="qn">${n}</span>${esc(q.pertanyaan).replace(/\n/g,'<br>')}</p>`;
if(q.tipe=='pg'){h+='<p class="hint">Pilih satu jawaban yang benar.</p>'+P.map((i,k)=>`<label class="opt ${ky&&ky[0]==i?'ok':''}"><input type="radio" name="${nm}" ${a===i?'checked':''} ${dis} onchange="setA('${q.id}',${i})"><b>${LET[k]}.</b>${oH(q.opsi[i])}</label>`).join('')}
else if(q.tipe=='mcma'){h+=`<p class="hint">Pilih ${q.jml||(q.kunci||[]).length||2} jawaban yang benar (centang).</p>`+P.map(i=>`<label class="opt ${ky&&ky.includes(i)?'ok':''}"><input type="checkbox" ${(a||[]).includes(i)?'checked':''} ${dis} onchange="togM('${q.id}',${i})">${oH(q.opsi[i])}</label>`).join('')}
else{const L=(q.kategori||'Benar|Salah').split('|');h+=`<p class="hint">Tentukan setiap pernyataan: ${L.join(' atau ')}.</p><div class="tw"><table><tr><th>Pernyataan</th>${L.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>`+P.map(i=>`<tr><td>${oH(q.opsi[i])}</td>${L.map((x,j)=>`<td><input type="radio" name="${nm}_${i}" ${(mode=='key'?ky[i]===j:a&&a[i]===j)?'checked':''} ${dis} onchange="setC('${q.id}',${i},${j})"></td>`).join('')}</tr>`).join('')+'</table></div>'}
return h}

let PT=null;
async function upFile(f){if(f.size>10e6){toast('Ukuran file maksimal 10 MB',1);return null}const path=Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');const {error}=await sb.storage.from('lampiran').upload(path,f,{contentType:f.type||'application/octet-stream'});
if(error){toast(error.message,1);return null}return sb.storage.from('lampiran').getPublicUrl(path).data.publicUrl}
async function upTo(inp,target,cb){const f=inp.files[0];if(!f)return;toast('Mengunggah…');const u=await upFile(f);if(!u)return;$('#'+target).value=u;if(cb)cb({url:u,img:/^image\//.test(f.type)});toast('Berhasil diunggah')}
async function upOpt(inp,i){const f=inp.files[0];if(!f)return;toast('Mengunggah…');const u=await upFile(f);if(!u)return;E.opsi[i]=mO(u,pO(E.opsi[i]).cap);eForm();toast('Gambar opsi diunggah')}
function pO(o){o=String(o==null?'':o);if(o.indexOf('@img:')!=0)return{img:'',cap:o};const k=o.indexOf('|');return k<0?{img:o.slice(5),cap:''}:{img:o.slice(5,k),cap:o.slice(k+1)}}
const mO=(u,c)=>u?'@img:'+u+(c?'|'+c:''):c;
function setCap(i,v){E.opsi[i]=mO(pO(E.opsi[i]).img,v);lp()}
function delImg(i){E.opsi[i]=pO(E.opsi[i]).cap;eForm()}
function kc(i,L){const e=E;return e.tipe=='pg'?`<input type="radio" name="kk" ${e.kunci[0]==i?'checked':''} onchange="eKey(${i})">`:e.tipe=='mcma'?`<input type="checkbox" ${e.kunci.includes(i)?'checked':''} onchange="eKey(${i},this.checked)">`:`<select onchange="E.kunci[${i}]=+this.value;lp()">${L.map((x,j)=>`<option value="${j}" ${e.kunci[i]===j?'selected':''}>${x}</option>`).join('')}</select>`}
/* Tempel (Ctrl+V) gambar dari clipboard ke stimulus / opsi */
document.addEventListener('paste',async ev=>{if(!E||!$('#lp')||(TS&&TS.on))return;const it=[...(ev.clipboardData&&ev.clipboardData.items||[])].find(x=>x.type.indexOf('image/')==0);if(!it)return;ev.preventDefault();
const f=it.getAsFile();if(!f)return;const t=PT||'s';
if(t=='s'&&['teks','grafik'].includes(E.sTipe)&&E.stimulus&&!confirm('Stimulus teks/grafik akan diganti dengan gambar yang ditempel. Lanjutkan?'))return;
toast('Mengunggah gambar tempelan…');const u=await upFile(new File([f],'paste_'+Date.now()+'.png',{type:f.type||'image/png'}));if(!u)return;
if(t=='s'){E.sTipe='gambar';E.stimulus=u}else{const i=+t.slice(1);E.opsi[i]=mO(u,pO(E.opsi[i]).cap)}PT=null;eForm();toast('Gambar berhasil ditempel')});

/* -- Bank soal -- */
async function aSoal(){if(!S.pkt.length)S.pkt=(await call('publik')).paket;if(!AS.pid)AS.pid=S.pkt[0].id;AS.soal=await call('soal_list',{paket_id:AS.pid});lSoal()}
function pk(){return S.pkt.find(x=>x.id==AS.pid)||{}}
function lSoal(){const P=pk();
$('#ap').innerHTML=`<div class="row"><select style="width:auto" onchange="AS.pid=+this.value;T(aSoal)">${S.pkt.map(x=>`<option value="${x.id}" ${x.id==AS.pid?'selected':''}>${x.mapel} – ${esc(x.judul)}${x.rilis?' (dirilis)':''}</option>`).join('')}</select><span><button class="b2 sm" onclick="prevPaket()">Pratinjau Seluruh Paket</button> <button class="btn sm" onclick="edit()">+ Tambah Soal</button></span></div>
<p class="hint">Status paket: <span class="pill ${P.rilis?'pub':''}">${P.rilis?'Dirilis':'Belum dirilis'}</span> — atur di tab Paket & Rilis.</p>
<div class="card tw"><table><tr><th>No</th><th>Jenis</th><th>Stimulus</th><th>Pertanyaan</th><th>Aksi</th></tr>${AS.soal.map((q,i)=>`<tr><td>${i+1}</td><td>${TIPE[q.tipe]}</td><td>${q.sTipe=='none'?'-':q.sTipe}</td><td>${esc(q.pertanyaan).slice(0,80)}</td>
<td><button class="b2 sm" onclick="geser('${q.id}',-1)">▲</button> <button class="b2 sm" onclick="geser('${q.id}',1)">▼</button> <button class="b2 sm" onclick="prevQ('${q.id}')">Pratinjau</button> <button class="b2 sm" onclick="edit('${q.id}')">Edit</button> <button class="b2 sm" onclick="hapusQ('${q.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada soal pada paket ini.</td></tr>'}</table></div>`}
const kA=q=>({[q.id]:q.tipe=='pg'?q.kunci[0]:q.kunci});
function prevQ(id){const q=AS.soal.find(x=>x.id==id);modal(`<h3>Pratinjau Soal</h3><p class="hint">Jawaban benar ditandai hijau. Tampilan sama seperti yang dilihat siswa.</p>`+qHTML(q,1,kA(q),'key','pv'))}
function prevPaket(){modal(`<h3>Pratinjau ${esc(pk().mapel)} – ${esc(pk().judul)}</h3><p class="hint">${AS.soal.length} soal. Jawaban benar ditandai hijau.</p>`+(AS.soal.map((q,i)=>`<div class="card">${qHTML(q,i+1,kA(q),'key','pp'+i)}</div>`).join('')||'<p>Belum ada soal.</p>'))}
function geser(id,d){T(async()=>{await call('soal_geser',{id,dir:d});aSoal()})}
function hapusQ(id){if(confirm('Hapus soal ini?'))T(async()=>{await call('soal_hapus',{id});aSoal()})}
function edit(id){E=id?JSON.parse(JSON.stringify(AS.soal.find(x=>x.id==id))):{id:'',paket_id:AS.pid,tipe:'pg',sTipe:'none',stimulus:'',pertanyaan:'',opsi:['','','',''],kunci:[],kategori:'Benar|Salah'};eForm()}
function eTipe(t){E.tipe=t;E.opsi=Array(t=='pg'?4:3).fill('');E.kunci=t=='kategori'?[0,0,0]:[];eForm()}
function eRem(i){E.opsi.splice(i,1);if(E.tipe=='kategori')E.kunci.splice(i,1);else if(E.tipe=='pg')E.kunci=E.kunci[0]==i?[]:E.kunci[0]>i?[E.kunci[0]-1]:E.kunci;else E.kunci=E.kunci.filter(k=>k!=i).map(k=>k>i?k-1:k);eForm()}
function eAdd(){E.opsi.push('');if(E.tipe=='kategori')E.kunci.push(0);eForm()}
function eKey(i,c){if(E.tipe=='pg')E.kunci=[i];else if(E.tipe=='mcma'){const k=E.kunci.indexOf(i);c&&k<0?E.kunci.push(i):!c&&k>=0&&E.kunci.splice(k,1)}lp()}
function eForm(){const e=E,L=(e.kategori||'Benar|Salah').split('|'),st=e.sTipe,inp=['gambar','file','link'].includes(st);
$('#ap').innerHTML=`<div class="ed"><div class="card"><h2>${e.id?'Edit':'Tambah'} Soal <span class="pill">${esc(pk().mapel)} – ${esc(pk().judul)}</span></h2>
<label class="f">Jenis soal</label><select onchange="eTipe(this.value)">${Object.keys(TIPE).map(k=>`<option value="${k}" ${k==e.tipe?'selected':''}>${TIPE[k]}</option>`).join('')}</select>
<label class="f">Stimulus</label><select onchange="E.sTipe=this.value;eForm()">${[['none','Tanpa stimulus'],['teks','Teks (tulis manual)'],['gambar','Gambar (unggah / URL)'],['grafik','Grafik batang (data manual)'],['file','File Word/PDF/Slide (unggah / URL)'],['link','Link']].map(x=>`<option value="${x[0]}" ${x[0]==st?'selected':''}>${x[1]}</option>`).join('')}</select>
${st=='teks'?`<textarea onfocus="PT='s'" oninput="E.stimulus=this.value;lp()" placeholder="Tulis teks stimulus">${esc(e.stimulus)}</textarea>`:''}
${st=='grafik'?`<textarea onfocus="PT='s'" oninput="E.stimulus=this.value;lp()" placeholder="Judul grafik&#10;Senin:10&#10;Selasa:25">${esc(e.stimulus)}</textarea><p class="hint">Baris pertama = judul. Baris berikutnya = Label:Nilai.</p>`:''}
${inp?`<input id="e_s" onfocus="PT='s'" value="${esc(e.stimulus)}" placeholder="https://…" oninput="E.stimulus=this.value;lp()">${st!='link'?`<label class="f">Unggah ${st=='gambar'?'gambar':'dokumen (pdf, docx, pptx) atau gambar'} — mengganti isi di atas</label><input type="file" accept="${st=='gambar'?'image/*':'.pdf,.doc,.docx,.ppt,.pptx,image/*'}" onchange="upTo(this,'e_s',u=>{E.stimulus=u.url;if(u.img)E.sTipe='gambar';eForm()})">`:''}`:''}
<div class="pz" tabindex="0" onfocus="PT='s'">📋 Klik di sini lalu tekan Ctrl+V untuk menempel gambar sebagai stimulus</div>
${st!='none'?`<p><button class="b2 sm" onclick="E.sTipe='none';E.stimulus='';eForm()">Hapus stimulus</button></p>`:''}
<label class="f">Pertanyaan</label><textarea onfocus="PT=null" oninput="E.pertanyaan=this.value;lp()">${esc(e.pertanyaan)}</textarea>
${e.tipe=='kategori'?`<label class="f">Pasangan kategori</label><select onchange="E.kategori=this.value;eForm()">${KAT.map(k=>`<option ${k==e.kategori?'selected':''}>${k}</option>`).join('')}</select>`:''}
<label class="f">${e.tipe=='kategori'?'Pernyataan & kunci':'Opsi jawaban (tandai kunci)'}</label>
${e.opsi.map((o,i)=>{const po=pO(o);return `<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><span style="min-width:150px;display:flex;align-items:center">${kc(i,L)}</span>${po.img?`<img class="opimg" src="${url(po.img)}" style="max-height:60px;max-width:90px"><input value="${esc(po.cap)}" onfocus="PT='o${i}'" oninput="setCap(${i},this.value)" placeholder="Keterangan gambar (opsional)"><button class="b2 sm" onclick="delImg(${i})">Hapus gambar</button>`:`<input value="${esc(po.cap)}" onfocus="PT='o${i}'" oninput="E.opsi[${i}]=this.value;lp()" placeholder="${e.tipe=='kategori'?'Pernyataan':'Opsi'} ${i+1}"><label class="b2 sm" style="cursor:pointer;white-space:nowrap">🖼 Gambar<input type="file" accept="image/*" style="display:none" onchange="upOpt(this,${i})"></label>`}<button class="b2 sm" onclick="eRem(${i})">×</button></div>`}).join('')}
<p class="hint">Tips: klik kolom opsi, lalu tekan Ctrl+V untuk menempel gambar dari clipboard.</p>
<button class="b2 sm" onclick="eAdd()">+ Tambah ${e.tipe=='kategori'?'pernyataan':'opsi'}</button>
<p class="row"><button class="btn" onclick="saveQ()">Simpan Soal</button><button class="b2" onclick="prevQ2()">Pratinjau Layar Penuh</button><button class="b2" onclick="T(aSoal)">Batal</button></p></div>
<div class="card pv"><h3>Pratinjau langsung</h3><div id="lp"></div></div></div>`;lp()}
function lp(){const e=$('#lp');if(e){const q=Object.assign({},E,{id:E.id||'x'});e.innerHTML=qHTML(q,1,kA(q),'key','lv')}}
function prevQ2(){const q=Object.assign({},E,{id:E.id||'x'});modal('<h3>Pratinjau Soal</h3>'+qHTML(q,1,kA(q),'key','pv'))}
function saveQ(){if(E.opsi.some(o=>!String(o).trim()))return toast('Semua opsi/pernyataan wajib diisi (teks atau gambar).',1);if(E.tipe=='pg'&&E.kunci.length!=1)return toast('Tandai satu kunci jawaban.',1);if(E.tipe=='mcma'&&E.kunci.length!=2)return toast('MCMA: tandai tepat 2 kunci jawaban.',1);if(E.tipe=='kategori'&&E.kunci.some(k=>k!==0&&k!==1))return toast('Pilih kunci tiap pernyataan.',1);
T(async()=>{await call('soal_simpan',{soal:E});toast('Soal disimpan');await aSoal()})}

async function aHasil(){const r=await call('hasil_list');window._H=r;
$('#ap').innerHTML=`<div class="row"><p>${r.length} hasil tes</p><button class="btn sm" onclick="xl()">Unduh Spreadsheet (.xlsx)</button></div><div class="card tw"><table><tr><th>Waktu</th><th>Nama</th><th>Kecamatan</th><th>Sekolah</th><th>Kelas</th><th>Mapel</th><th>Paket</th><th>Nilai</th><th>Benar</th><th>Pelanggaran</th><th></th></tr>${r.map(x=>`<tr><td>${new Date(x.waktu).toLocaleString('id-ID')}</td><td>${esc(x.nama)}</td><td>${esc(x.kecamatan)}</td><td>${esc(x.sekolah)}</td><td>${esc(x.kelas)}</td><td>${esc(x.mapel)}</td><td>${x.paket_no}</td><td><b>${x.skor}</b></td><td>${x.benar}/${x.total}</td><td>${x.pelanggaran?`<span class="pill pub">${x.pelanggaran}</span>`:'0'}${x.catatan||x.pelanggaran?` <button class="b2 sm" onclick="detH('${x.id}')">Detail</button>`:''}</td><td><button class="b2 sm" onclick="hapusH('${x.id}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function xl(){const rows=window._H.map(r=>({Waktu:new Date(r.waktu).toLocaleString('id-ID'),Nama:r.nama,Kecamatan:r.kecamatan,Sekolah:r.sekolah,Kelas:r.kelas,Mapel:r.mapel,Paket:r.paket_no,Nilai:r.skor,'Benar penuh':r.benar,'Jumlah soal':r.total,Pelanggaran:r.pelanggaran,Catatan:r.catatan}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Hasil');XLSX.writeFile(wb,'hasil_cbt_tka.xlsx')}
function detH(id){const r=window._H.find(x=>x.id==id),L=Array.isArray(r.jejak)?r.jejak:[];modal(`<h3>Catatan Anti-Curang – ${esc(r.nama)}</h3><p>${esc(r.catatan||'Tidak ada catatan sistem.')}</p>${L.length?`<table><tr><th>Detik ke-</th><th>Kejadian</th></tr>${L.map(x=>`<tr><td>${esc(x.s)}</td><td>${esc(x.r)}</td></tr>`).join('')}</table>`:'<p>Tidak ada rincian pelanggaran.</p>'}`)}
function hapusH(id){if(confirm('Hapus hasil ini?'))T(async()=>{await call('hasil_hapus',{id});aHasil()})}

$('#ap').innerHTML=`<div class="card"><h2>Admin</h2><div class="tw"><table><tr><th>Username</th><th>Nama</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.nama)}</td><td><button class="b2 sm" onclick="hapusA('${esc(x.username)}')">Hapus</button></td></tr>`).join('')}</table></div>
