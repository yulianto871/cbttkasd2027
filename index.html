<style>
:root{--r:#C8102E;--t:#2b2b33;--m:#7a7a85;--l:#f0e4e6;--bg:#fff;--soft:#fff3f5;--pink:#ffe0e5;--gold:#FFC83D;--rad:18px;--sh:0 6px 0 rgba(200,16,46,.14),0 10px 24px rgba(200,16,46,.08)}
*{box-sizing:border-box}

header{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;border-bottom:4px solid var(--r);border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(200,16,46,.10)}

.hero::before{width:220px;height:220px;right:-60px;top:-70px}.hero::after{width:120px;height:120px;left:42%;bottom:-50px;opacity:.4}
.hero>div{position:relative;z-index:1}.hero img{width:100%;border-radius:22px;max-height:300px;object-fit:cover;border:4px solid #fff;box-shadow:var(--sh)}

.bubble{background:#fff;border:3px solid var(--r);border-radius:20px;padding:10px 16px;font-weight:800;color:var(--r);display:inline-block;margin-top:10px;position:relative}

@keyframes pulse{50%{transform:scale(1.05)}}.pulse{animation:pulse 1.8s ease-in-out infinite}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.st{background:#fff;border:3px solid var(--pink);border-radius:var(--rad);padding:14px;text-align:center}.st .ic{font-size:30px;display:block}
.st b{display:block;font-family:'Baloo 2',sans-serif;font-size:32px;color:var(--r);line-height:1.1}.st span{font-size:13px;color:var(--m);font-weight:700}
.card{background:#fff;border:3px solid var(--pink);border-radius:24px;padding:22px;margin-bottom:18px}
.btn,.b2{border:0;border-radius:99px;padding:11px 22px;font:inherit;font-weight:800;cursor:pointer;background:var(--r);color:#fff;box-shadow:0 4px 0 #8f0b21;transition:transform .12s,box-shadow .12s}

.btn:hover,.b2:hover{transform:translateY(-2px)}.btn:active,.b2:active{transform:translateY(3px);box-shadow:none}
.btn.lg{font-size:19px;padding:14px 30px;margin-top:8px}.sm{padding:5px 12px;font-size:12px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:disabled,.b2:disabled{opacity:.45;cursor:default;transform:none}
label.f{display:block;font-size:15px;font-weight:800;margin:14px 0 5px}
input,select,textarea{width:100%;padding:12px 14px;border:2.5px solid #eadadd;border-radius:14px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r);box-shadow:0 0 0 4px var(--pink)}
input[type=radio],input[type=checkbox]{width:22px;height:22px;accent-color:var(--r);flex:none}
textarea{min-height:90px;resize:vertical}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--r);color:#fff;text-align:left;padding:9px}th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:9px;border-bottom:2px solid var(--soft);vertical-align:top}
.tw{overflow-x:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:3px 12px;border-radius:99px;font-size:12px;font-weight:800;background:var(--soft);color:var(--m);white-space:nowrap}.pill.pub{background:var(--r);color:#fff}
.form{max-width:540px;margin:auto;text-align:left}.form .mascot,.res .mascot,.intro .mascot{display:block;text-align:center}.form h2,.form>.hint{text-align:center}
.hello{background:var(--soft)}

.mh{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--r);color:#fff}.mh h3{margin:0;color:#fff;font-size:24px}.mh .ic{font-size:30px;background:#fff;border-radius:50%;width:48px;height:48px;display:grid;place-items:center}

.pgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:18px}
.pc{border:3px solid var(--r);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;box-shadow:var(--sh)}

.pc small{color:var(--m);font-weight:700}.pc em{font-size:13px;font-style:normal;font-weight:800;color:var(--m)}.pc.done{border-color:#f0b4bd;background:var(--soft)}.pc.done em{color:var(--r)}
.pc.off{border:3px dashed #ddd;background:#fafafa;box-shadow:none;color:var(--m)}.pc.off .no{background:#ccc}
.stim{background:var(--soft);border:2.5px dashed var(--pink);border-radius:16px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:17px;line-height:1.55}.stim img{max-width:100%;border-radius:12px}.stim iframe{width:100%;height:420px;border:0;border-radius:12px}
.chart{width:100%;max-width:480px;background:#fff;border-radius:12px}
.qt{font-size:20px;font-weight:700;line-height:1.5;margin:6px 0 10px}.qn{display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:50%;background:var(--r);color:#fff;font-size:18px;margin-right:10px;vertical-align:middle}

.opt:has(input:checked)>b{background:var(--r);color:#fff}.opt.ok{border-color:#1a8f3c;background:#effaf2}
.hint{font-size:14px;color:var(--m);margin:0 0 8px;font-weight:700}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.nums button{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--pink);background:#fff;font:800 16px 'Baloo 2',sans-serif;cursor:pointer}
.nums .cur{border-color:var(--r);color:var(--r);transform:scale(1.15)}.nums .done{background:var(--r);color:#fff;border-color:var(--r)}
.testbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}.tt{display:flex;flex-direction:column}.tt b{font-family:'Baloo 2',sans-serif;font-size:20px;color:var(--r)}.tt small{color:var(--m);font-weight:700}
.timer{background:var(--r);color:#fff;padding:6px 16px;border-radius:99px;font-size:20px;box-shadow:0 4px 0 #8f0b21}.timer::before{content:'⏰ '}
.prog{height:16px;background:var(--pink);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--r);border-radius:99px;transition:width .3s}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.res{text-align:center;max-width:540px;margin:auto}.stars{font-size:46px;letter-spacing:6px;color:#e6dadc;line-height:1}.stars .on{color:var(--gold);text-shadow:0 3px 0 #c99a1d;animation:pop .5s both}.stars span:nth-child(2){animation-delay:.2s}.stars span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.ring{width:160px;height:160px;border-radius:50%;margin:12px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:conic-gradient(var(--r) calc(var(--p)*1%),var(--pink) 0);position:relative}
.ring::before{content:'';position:absolute;inset:16px;background:#fff;border-radius:50%}.ring b,.ring small{position:relative;z-index:1}.ring b{font-family:'Baloo 2',sans-serif;font-size:56px;line-height:1;color:var(--r)}.ring small{font-weight:800;color:var(--m)}
.msg{font-size:20px;font-weight:800;color:var(--r)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 3.6s linear forwards}@keyframes fall{to{top:105%;transform:rotate(720deg)}}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:10px 0 20px}
.pd{flex:1;max-width:210px;background:#fff;border:3px solid var(--pink);border-radius:22px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}.pd b{word-break:break-word}.pd small{color:var(--m)}
.pd.p0{border-color:var(--r);padding-top:26px;box-shadow:var(--sh);background:var(--soft)}.pd.p1{padding-top:18px}.md2{font-size:42px}.pd .sc{font-family:'Baloo 2',sans-serif;font-size:30px;color:var(--r)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.ed .pv{position:sticky;top:90px}
.mb{position:fixed;inset:0;background:rgba(40,0,8,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.md{background:#fff;border-radius:26px;padding:24px;width:100%;max-width:760px;position:relative;border:4px solid var(--pink)}.x{position:absolute;right:14px;top:8px;border:0;background:none;font-size:30px;cursor:pointer;color:var(--r)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:12px 22px;border-radius:99px;z-index:50;display:none;max-width:90vw;font-weight:700}#toast.e{background:var(--r)}
.opimg{max-width:100%;max-height:220px;border-radius:10px;vertical-align:middle}
.pz{border:2.5px dashed var(--r);border-radius:14px;padding:12px;text-align:center;color:var(--r);font-size:13px;font-weight:700;margin:8px 0;cursor:text}.pz:focus{background:var(--soft);outline:none}
.testmode,.testmode *{user-select:none;-webkit-user-select:none}.testmode input,.testmode label{user-select:auto}
.eqb{background:var(--soft);border:2.5px dashed var(--pink);border-radius:16px;padding:12px;margin-bottom:10px}
.eqbtns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.eqbtns button{border:2px solid var(--pink);background:#fff;border-radius:10px;padding:4px 9px;font:700 14px 'Nunito',sans-serif;cursor:pointer;min-width:34px;color:var(--t)}.eqbtns button:hover{background:var(--pink)}
.eqpv{min-height:36px;padding:6px 2px;font-size:19px}.katex{font-size:1.1em}
@media print{body.testmode{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){.hero,.ed,.g2{grid-template-columns:1fr}.ed .pv{position:static}.hero{padding:22px}.pod{gap:6px}.opt{font-size:17px}}
</style></head><body>

<script>
/* >>> ISI DENGAN DATA PROYEK SUPABASE ANDA (Project Settings → API) <<< */
const SUPABASE_URL='https://hrdoboisvoqsbcctwmxc.supabase.co';
const SUPABASE_KEY='sb_publishable_M2sDsMHV16CrLMlEE2MLUg_HUWUkrmt';

const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=v=>/^(https?:\/\/|data:image\/(png|jpe?g|gif|webp);base64,)/.test(v||'')?esc(v):'';
let sb,S={cfg:{},kec:[],stat:{},pkt:[],tok:null,me:null,peserta:null,view:'dash'},TS,TM,E,AS={soal:[],pid:0},LB={m:'',n:''};
const MAPEL=['Matematika','Bahasa Indonesia'],LET='ABCDEFGH',KAT=['Benar|Salah','Tepat|Kurang Tepat','Sesuai|Tidak Sesuai'];
const TIPE={pg:'Pilihan Ganda',mcma:'Pilihan Ganda Kompleks (MCMA)',kategori:'Pilihan Ganda Kategori'};
async function call(a,p){const {data,error}=await sb.rpc('api',{action:a,p:Object.assign({},p||{},{token:S.tok})});if(error)throw new Error(error.message);return data}
function toast(m,e,ms){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||4000)}
async function T(f){try{return await f()}catch(e){toast(e.message||String(e),1)}}
function modal(h){$('#modal').innerHTML=`<div class="mb" onclick="if(event.target==this)closeM()"><div class="md"><button class="x" onclick="closeM()">×</button>${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function theme(){document.documentElement.style.setProperty('--r',S.cfg.warnaMerah||'#C8102E');$('#brand').innerHTML='<span class="logo">🎓</span>'+esc(S.cfg.judul||'CBT TKA SD');document.title=S.cfg.judul||'CBT TKA SD'}
function nav(){const m=[['dash','🏠 Dashboard'],['daftar','✏️ Daftar & Kerjakan Tes'],['lb','🏆 Leader Board'],['unduh','📄 Unduh Hasil'],S.tok?['admin','⚙️ Panel Admin']:['login','🔑 Login Admin']];
$('#nav').style.display=(TS&&TS.on)?'none':'';$('#nav').innerHTML=m.map(x=>`<a href="#" class="${S.view==x[0]?'on':''}" onclick="show('${x[0]}');return false">${x[1]}</a>`).join('')}
function show(v){if(TS&&TS.on)return toast('Selesaikan tes terlebih dahulu.',1);clearInterval(TM);S.view=v;nav();window.scrollTo(0,0);({dash:vDash,daftar:vDaftar,lb:vLb,unduh:vUnduh,login:vLogin,admin:vAdmin})[v]()}
(async()=>{try{
if(SUPABASE_URL.indexOf('supabase.co')<0)throw new Error('SUPABASE_URL & SUPABASE_KEY belum diisi di index.html.');
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
try{const a=JSON.parse(sessionStorage.getItem('adm'));if(a){S.tok=a.token;S.me=a}}catch(e){}
const d=await call('publik');S.cfg=d.cfg;S.kec=d.kecamatan;S.stat=d.stat;S.pkt=d.paket;theme();show('dash')}
catch(e){$('#app').innerHTML=`<div class="card"><b>Aplikasi belum siap.</b><p>${esc(e.message)}</p></div>`}})();

/* ===== Dashboard ===== */
function vDash(){const c=S.cfg;
$('#app').innerHTML=`<section class="hero"><div><span class="chip">🎉 Ayo belajar bersama!</span><h1>${esc(c.judul)}</h1><p class="sub">${esc(c.subjudul)}</p><p>${esc(c.deskripsi)}</p><button class="btn lg pulse" onclick="show('daftar')">${esc(c.teksTombol)} 🚀</button></div><div class="hr">${url(c.bannerUrl)?`<img src="${url(c.bannerUrl)}" alt="">`:`<div class="mascot big">🦉</div><br><div class="bubble">Halo, teman-teman! Siap jadi juara? 🌟</div>`}</div></section><div class="stats" id="st"></div><div class="card"><h2>📌 Petunjuk</h2><p>${esc(c.petunjuk)}</p></div>`;
T(async()=>{const d=await call('publik');S.stat=d.stat;const s=d.stat;$('#st').innerHTML=[['👧','Peserta',s.peserta],['✅','Tes selesai',s.tes],['⭐','Rata-rata nilai',s.rata],['🔓','Paket dirilis',s.dirilis+' / 20']].map(x=>`<div class="st"><span class="ic">${x[0]}</span><b>${x[2]}</b><span>${x[1]}</span></div>`).join('')})}

/* ===== Daftar & tes ===== */
function vDaftar(){const p=S.peserta;
if(!p){$('#app').innerHTML=`<div class="card form"><div class="mascot">🦉</div><h2>Ayo Daftar Dulu!</h2><p class="hint">Isi datamu dengan benar ya, teman-teman.</p>
<label class="f">🧒 Nama Lengkap</label><input id="d_n" placeholder="Tulis nama lengkapmu">
<label class="f">📍 Kecamatan (Kabupaten Wonosobo)</label><select id="d_k"><option value="">— pilih kecamatan —</option>${S.kec.map(k=>`<option>${k}</option>`).join('')}</select>
<label class="f">🏫 Nama Sekolah</label><input id="d_s" placeholder="contoh: SD Negeri 1 Wonosobo">
<label class="f">🎒 Kelas</label><input id="d_c" placeholder="contoh: 6A">
<p style="text-align:center"><button class="btn lg" onclick="daftar()">Daftar & Lanjut 🚀</button></p></div>`;return}
$('#app').innerHTML=`<div class="card row hello"><div><h2 style="margin:0">👋 Halo, ${esc(p.nama)}!</h2><span class="hint">${esc(p.sekolah)} · Kelas ${esc(p.kelas)} · Kec. ${esc(p.kecamatan)}</span></div><button class="b2 sm" onclick="S.peserta=null;vDaftar()">Ganti peserta</button></div><p class="hint" style="font-size:16px">Pilih paket soal yang sudah terbuka, lalu kerjakan dengan teliti ya! 💪</p><div id="pk">Memuat paket…</div>`;
T(async()=>{const d=await call('publik',{peserta_id:p.id});S.pkt=d.paket;if(d.cfg)S.cfg=d.cfg;
$('#pk').innerHTML=MAPEL.map((m,mi)=>`<div class="mp m${mi+1}"><div class="mh"><span class="ic">${mi?'📚':'📐'}</span><h3>${m}</h3></div><div class="pgd">${d.paket.filter(x=>x.mapel==m).map(x=>{const done=d.selesai.includes(x.id),ok=x.rilis&&x.jml>0;
return `<div class="pc ${done?'done':ok?'':'off'}"><div class="no">${ok||done?x.nomor:'🔒'}</div><b>${esc(x.judul)}</b><small>${x.jml} soal · ${x.durasi} menit</small>${done?'<em>✅ Sudah selesai</em>':ok?`<button class="btn sm" onclick="intro(${x.id})">Kerjakan 🚀</button>`:'<em>Belum dibuka</em>'}</div>`}).join('')}</div></div>`).join('')})}
function daftar(){T(async()=>{S.peserta=await call('daftar',{nama:$('#d_n').value,kecamatan:$('#d_k').value,sekolah:$('#d_s').value,kelas:$('#d_c').value});toast('Pendaftaran berhasil');vDaftar()})}
const TF=v=>v===true||v===1||v==='t'||v==='true'||v==='1';
function acakMap(){try{const m=JSON.parse(S.cfg.acak_paket||'{}');return m&&typeof m=='object'?m:{}}catch(e){return{}}}
function acakOf(x,extra){let s=false,o=false;[x,extra].forEach(r=>Object.keys(r||{}).forEach(k=>{const n=k.replace(/[_\s]/g,'');if(/^acak(nomor)?soal$/i.test(n)&&TF(r[k]))s=true;if(/^acak(opsi|pilihan|jawaban)$/i.test(n)&&TF(r[k]))o=true}));

function chart(v){const L=v.split('\n').map(s=>s.trim()).filter(Boolean),t=L.shift()||'',d=L.map(l=>{const i=l.lastIndexOf(':');return[l.slice(0,i),parseFloat(l.slice(i+1))||0]}),m=Math.max(1,...d.map(x=>x[1])),W=d.length*60+50;
return `<svg viewBox="0 0 ${W} 190" class="chart"><text x="${W/2}" y="14" text-anchor="middle" font-size="11" font-weight="700">${esc(t)}</text><line x1="30" y1="160" x2="${W-5}" y2="160" stroke="#999"/>`+d.map((x,i)=>{const h=x[1]/m*120,X=40+i*60;return `<rect x="${X}" y="${160-h}" width="40" height="${h}" fill="#C8102E"/><text x="${X+20}" y="${155-h}" text-anchor="middle" font-size="10">${x[1]}</text><text x="${X+20}" y="175" text-anchor="middle" font-size="9">${esc(x[0])}</text>`}).join('')+'</svg>'}
function emb(v){if(!url(v))return '';const m=v.match(/drive\.google\.com\/file\/d\/([^\/]+)/);if(m)return `<iframe src="https://drive.google.com/file/d/${esc(m[1])}/preview"></iframe>`;
const x=v.split('?')[0].toLowerCase();if(/\.pdf$/.test(x))return `<iframe src="${url(v)}"></iframe>`;
if(/\.(docx?|pptx?|xlsx?)$/.test(x))return `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(v)}"></iframe>`;
if(/\.(png|jpe?g|gif|webp)$/.test(x))return `<img src="${url(v)}" alt="">`;return `<a href="${url(v)}" target="_blank" rel="noopener">Buka lampiran stimulus</a>`}

if(t=='teks')b=mt(v);else if(t=='gambar')b=url(v)?`<img src="${url(v)}" alt="Stimulus gambar">`:'';else if(t=='grafik')b=chart(v);else b=emb(v);

/* -- Hasil -- */
async function aHasil(){const r=await call('hasil_list');window._H=r;
$('#ap').innerHTML=`<div class="row"><p>${r.length} hasil tes</p><button class="btn sm" onclick="xl()">Unduh Spreadsheet (.xlsx)</button></div><div class="card tw"><table><tr><th>Waktu</th><th>Nama</th><th>Kecamatan</th><th>Sekolah</th><th>Kelas</th><th>Mapel</th><th>Paket</th><th>Nilai</th><th>Benar</th><th>Pelanggaran</th><th></th></tr>${r.map(x=>`<tr><td>${new Date(x.waktu).toLocaleString('id-ID')}</td><td>${esc(x.nama)}</td><td>${esc(x.kecamatan)}</td><td>${esc(x.sekolah)}</td><td>${esc(x.kelas)}</td><td>${esc(x.mapel)}</td><td>${x.paket_no}</td><td><b>${x.skor}</b></td><td>${x.benar}/${x.total}</td><td>${x.pelanggaran?`<span class="pill pub">${x.pelanggaran}</span>`:'0'}${x.catatan||x.pelanggaran?` <button class="b2 sm" onclick="detH('${x.id}')">Detail</button>`:''}</td><td><button class="b2 sm" onclick="hapusH('${x.id}')">Hapus</button></td></tr>`).join('')}</table></div>`}
function xl(){const rows=window._H.map(r=>({Waktu:new Date(r.waktu).toLocaleString('id-ID'),Nama:r.nama,Kecamatan:r.kecamatan,Sekolah:r.sekolah,Kelas:r.kelas,Mapel:r.mapel,Paket:r.paket_no,Nilai:r.skor,'Benar penuh':r.benar,'Jumlah soal':r.total,Pelanggaran:r.pelanggaran,Catatan:r.catatan}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Hasil');XLSX.writeFile(wb,'hasil_cbt_tka.xlsx')}
function detH(id){const r=window._H.find(x=>x.id==id),L=Array.isArray(r.jejak)?r.jejak:[];modal(`<h3>Catatan Anti-Curang – ${esc(r.nama)}</h3><p>${esc(r.catatan||'Tidak ada catatan sistem.')}</p>${L.length?`<table><tr><th>Detik ke-</th><th>Kejadian</th></tr>${L.map(x=>`<tr><td>${esc(x.s)}</td><td>${esc(x.r)}</td></tr>`).join('')}</table>`:'<p>Tidak ada rincian pelanggaran.</p>'}`)}
function hapusH(id){if(confirm('Hapus hasil ini?'))T(async()=>{await call('hasil_hapus',{id});aHasil()})}

/* -- Anggota -- */
async function aAgt(){const [a,p]=await Promise.all([call('admin_list'),call('peserta_list')]);
$('#ap').innerHTML=`<div class="card"><h2>Admin</h2><div class="tw"><table><tr><th>Username</th><th>Nama</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.nama)}</td><td><button class="b2 sm" onclick="hapusA('${esc(x.username)}')">Hapus</button></td></tr>`).join('')}</table></div>
<h3 style="margin-top:16px">Tambah admin</h3><div class="g2"><div><label class="f">Username</label><input id="a_u"></div><div><label class="f">Nama</label><input id="a_n"></div></div><label class="f">Password (min. 6 karakter)</label><input id="a_p" type="password"><p><button class="btn sm" onclick="tambahA()">Tambah Admin</button></p>
<h3>Ganti password saya</h3><div class="g2"><div><input id="g_l" type="password" placeholder="Password lama"></div><div><input id="g_b" type="password" placeholder="Password baru"></div></div><p><button class="b2 sm" onclick="gantiP()">Ganti Password</button></p></div>
<div class="card"><h2>Peserta (${p.length})</h2><div class="tw"><table><tr><th>Nama</th><th>Kecamatan</th><th>Sekolah</th><th>Kelas</th><th></th></tr>${p.map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(x.kecamatan)}</td><td>${esc(x.sekolah)}</td><td>${esc(x.kelas)}</td><td><button class="b2 sm" onclick="hapusP('${x.id}')">Hapus</button></td></tr>`).join('')}</table></div></div>`}
function tambahA(){T(async()=>{await call('admin_tambah',{username:$('#a_u').value,nama:$('#a_n').value,password:$('#a_p').value});toast('Admin ditambahkan');aAgt()})}
function hapusA(u){if(confirm('Hapus admin '+u+'?'))T(async()=>{await call('admin_hapus',{username:u});aAgt()})}
function hapusP(id){if(confirm('Hapus peserta beserta nilainya?'))T(async()=>{await call('peserta_hapus',{id});aAgt()})}
function gantiP(){T(async()=>{await call('admin_password',{lama:$('#g_l').value,baru:$('#g_b').value});toast('Password diganti');$('#g_l').value=$('#g_b').value=''})}
</script></body></html>
